name: AHK Web - Deploy to Mezga

# Manual trigger only: this deploys to the on-prem IIS server behind the BME VPN.
on:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Ignore the stored deployment manifest and copy everything (use after a manual change on the server)"
        type: boolean
        default: false

env:
  NODE_VERSION: "24"
  # Relative to the ahk-backend/ working directory used by the dotnet steps below (not repo root) — that
  # working directory is what lets the .NET SDK's own global.json discovery (a directory walk-up from CWD)
  # find ahk-backend/global.json and pin the exact SDK, rather than floating.
  BACKEND_PROJECT: Ahk.Web.Server/Ahk.Web.Server.csproj
  SOLUTION: Ahk.Web.slnx
  DATA_PROJECT: Ahk.Web.Data
  FRONTEND_DIR: ahk-frontend
  OFFLINE_PAGE: ahk-backend/Ahk.Web.Server/app_offline.htm
  MOUNT_POINT: /mnt/deploy
  # Lives at the CIFS mount's root — a sibling of wwwroot/, the .exe and appsettings.json, never inside
  # the ASP.NET Core app's own static-file root, so it is never web-reachable and never touched by the
  # targeted copy/delete steps below.
  MANIFEST_NAME: .deploy-manifest.sha256

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Mezga environment holds the VPN_ADDRESS / DEPLOYMENT_PATH variables and every secret, and
    # gates the run behind whatever protection rules the environment defines.
    environment: Mezga

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned via ahk-backend/global.json (rollForward: disable), not a floating "10.0.x" — a self-contained
      # publish embeds the entire runtime, so an unpinned SDK/package patch changes nearly every file's hash
      # and silently defeats the manifest-diff deploy below. See CLAUDE.md for the incident this fixes.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ahk-backend/global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      # ---- A. Build & test (fail-fast: nothing below runs if a test fails) ----

      - name: Backend tests
        working-directory: ahk-backend
        run: dotnet test ${{ env.SOLUTION }} --configuration Release

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Frontend tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx ng test --watch=false

      # ---- B. Produce artifacts ----

      - name: Publish backend (self-contained win-x64 via Mezga profile)
        working-directory: ahk-backend
        run: dotnet publish ${{ env.BACKEND_PROJECT }} -p:PublishProfile=Mezga -o ../publish

      - name: Build frontend (production)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx ng build --configuration production

      - name: Copy SPA into backend wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r ${{ env.FRONTEND_DIR }}/dist/ahk-frontend/browser/. publish/wwwroot/

      - name: Generate idempotent migration script (artifact only — applied manually)
        working-directory: ahk-backend
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project ${{ env.DATA_PROJECT }} \
            --startup-project ${{ env.DATA_PROJECT }} \
            -o ../migrate.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migrate-sql
          path: migrate.sql

      # ---- C. Inject production config (never committed) ----

      - name: Inject connection string and OIDC client secret
        env:
          DATABASE_CONNECTIONSTRING: ${{ secrets.DATABASE_CONNECTIONSTRING }}
          OIDC_CLIENTSECRET: ${{ secrets.OIDC_CLIENTSECRET }}
        run: |
          jq --arg cs "$DATABASE_CONNECTIONSTRING" --arg secret "$OIDC_CLIENTSECRET" \
            '.ConnectionStrings.Default = $cs | .Authentication.Oidc.ClientSecret = $secret' \
            publish/appsettings.json > publish/appsettings.json.tmp
          mv publish/appsettings.json.tmp publish/appsettings.json

      # Last content-mutating step before the diff: hashing anything after this point (e.g. re-injecting
      # config) would make the manifest describe a tree that no longer matches what gets copied.
      - name: Compute local deployment manifest
        run: (cd publish && find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum) > new.manifest

      # ---- D. VPN (SSTP) up ----

      - name: Install SSTP client
        run: sudo apt-get update && sudo apt-get install -y sstp-client ppp cifs-utils

      - name: Connect SSTP VPN
        id: vpn
        env:
          VPN_ADDRESS: ${{ vars.VPN_ADDRESS }}
          VPN_USER: ${{ vars.VPN_USER }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          sudo sstpc --log-stderr \
            --user "$VPN_USER" --password "$VPN_PASSWORD" \
            "$VPN_ADDRESS" \
            usepeerdns require-mschap-v2 noauth noipdefault refuse-eap \
            unit 0 > /tmp/sstpc.log 2>&1 &
          # Wait (up to ~60s) for the ppp0 interface to acquire an address.
          for i in $(seq 1 30); do
            if ip -4 addr show ppp0 2>/dev/null | grep -q 'inet '; then
              echo "VPN up:"; ip -4 addr show ppp0
              exit 0
            fi
            sleep 2
          done
          echo "::error::SSTP VPN did not come up within timeout"
          cat /tmp/sstpc.log || true
          exit 1

      - name: Route BME-internal hosts through the tunnel
        env:
          VPN_ROUTES: ${{ vars.VPN_ROUTES }}
        run: |
          for cidr in $VPN_ROUTES; do
            echo "Routing $cidr via ppp0"
            sudo ip route replace "$cidr" dev ppp0
          done
          ip route show

      # ---- E. Mount share, diff against last deploy, swap site ----

      - name: Mount deployment share
        env:
          DEPLOYMENT_PATH: ${{ vars.DEPLOYMENT_PATH }}
          FILE_USERNAME: ${{ vars.FILE_USERNAME }}
          FILE_USERDOMAIN: ${{ vars.FILE_USERDOMAIN }}
          FILE_PASSWORD: ${{ secrets.FILE_PASSWORD }}
        run: |
          sudo mkdir -p "$MOUNT_POINT"
          # Pass credentials via a file, not inline -o. mount.cifs splits -o on commas, so a comma or
          # other special char in the password is parsed as an option separator, silently truncating the
          # password and failing auth with mount error(13) Permission denied. The file sidesteps that.
          CREDS=$(mktemp)
          chmod 600 "$CREDS"
          {
            echo "username=$FILE_USERNAME"
            echo "password=$FILE_PASSWORD"
            echo "domain=$FILE_USERDOMAIN"
          } > "$CREDS"
          if ! sudo mount -t cifs "$DEPLOYMENT_PATH" "$MOUNT_POINT" \
              -o credentials="$CREDS",vers=3.0,sec=ntlmssp,uid=$(id -u),gid=$(id -g); then
            echo "::error::CIFS mount failed; recent kernel (dmesg) messages:"
            sudo dmesg | tail -30 || true
            rm -f "$CREDS"
            exit 1
          fi
          rm -f "$CREDS"

      # Reads exactly one small file from the share — regardless of link speed this is fast, unlike
      # reading file content to compare it (the actual reason the old rsync mirror was slow).
      - name: Fetch previous deployment manifest
        env:
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          if [ "$FORCE_FULL" = "true" ]; then
            echo "force_full requested — treating the stored manifest as empty (full re-copy)."
            : > old.manifest
          elif [ -f "$MOUNT_POINT/$MANIFEST_NAME" ]; then
            cp "$MOUNT_POINT/$MANIFEST_NAME" old.manifest
          else
            echo "No manifest found on the share yet — treating this as a first-time full deploy."
            : > old.manifest
          fi

      # Pure local text processing — no network cost. sha256sum's format is 64 hex chars + two spaces +
      # path, so "cut -c 67-" reliably extracts the path column regardless of spaces in a filename.
      - name: Diff manifests
        id: diff
        run: |
          sort old.manifest -o old.sorted
          sort new.manifest -o new.sorted

          # Changed or added: whole lines (hash+path) present in the new build but not the old one —
          # covers both "hash changed at an existing path" and "brand-new path".
          comm -13 old.sorted new.sorted | cut -c 67- > changed.list

          # Removed: paths that existed before and are entirely absent from the new build — this is what
          # correctly prunes Angular's abandoned content-hashed chunk files, unlike a size comparison.
          cut -c 67- old.manifest | sort -u > old.paths
          cut -c 67- new.manifest | sort -u > new.paths
          comm -23 old.paths new.paths > removed.list

          changed=$(wc -l < changed.list)
          removed=$(wc -l < removed.list)
          echo "Changed/added: $changed, removed: $removed"

          if [ "$changed" -eq 0 ] && [ "$removed" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop site (drop app_offline.htm)
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          cp "$OFFLINE_PAGE" "$MOUNT_POINT/app_offline.htm"
          # Give IIS a moment to notice and release file locks before copying. Must clear web.config's
          # shutdownTimeLimit=30 (the webhook delivery worker's graceful-shutdown budget) with room to
          # spare, or file operations below can start racing a lock the old process hasn't released yet —
          # 20s used to be shorter than that budget, which is exactly the kind of gap that turns into an
          # unexplained multi-minute stall further down with no visible cause.
          sleep 35

      # Copies exactly the changed/added files (preserving their relative subdirectories) and deletes
      # exactly the removed ones. --ignore-times/--whole-file/--inplace stop rsync from doing any of its
      # own (CIFS-costly) comparison or delta-transfer logic — we already know these files need moving.
      - name: Apply changed files
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          set -o pipefail

          changed_count=$(wc -l < changed.list)
          removed_count=$(wc -l < removed.list)

          # Bytes about to cross the tunnel. A self-contained publish is a handful of very large files
          # plus a long tail, so "which files" explains a slow run far better than "how many".
          changed_bytes=0
          if [ -s changed.list ]; then
            changed_bytes=$(sed 's|^|publish/|' changed.list | tr '\n' '\0' \
              | xargs -0 -r stat -c %s 2>/dev/null | awk '{s+=$1} END {print s+0}')
          fi

          echo "Copying $changed_count file(s), $(numfmt --to=iec --suffix=B "$changed_bytes"); deleting $removed_count."

          if [ -s changed.list ]; then
            echo "::group::Ten largest files in this transfer"
            sed 's|^|publish/|' changed.list | tr '\n' '\0' \
              | xargs -0 -r stat -c '%s %n' 2>/dev/null \
              | sort -rn | head -10 \
              | awk '{ size=$1; $1=""; sub(/^ /,""); printf "%10s  %s\n", size, $0 }' \
              | numfmt --to=iec --suffix=B --field=1 || true
            echo "::endgroup::"
          fi

          # Millisecond resolution: a fast deploy still has to report a throughput figure, otherwise
          # there is no baseline to compare a slow one against.
          copy_ms=0
          attempts=0
          if [ -s changed.list ]; then
            ok=0
            copy_start=$(date +%s%3N)
            for i in $(seq 1 10); do
              attempts=$i
              echo "::group::rsync attempt $i"
              attempt_start=$(date +%s%3N)
              # --out-format stamps every file with the wall-clock time it landed, which is what turns
              # "the deploy was slow" into "it stalled for 90s on this one file". --stats reports the
              # effective transfer rate over the tunnel.
              if rsync -R --files-from=changed.list --ignore-times --whole-file --inplace \
                  --no-perms --no-owner --no-group --no-times \
                  --stats --human-readable --out-format='%t  %12l  %n' \
                  publish/ "$MOUNT_POINT/"; then
                ok=1
                echo "Attempt $i succeeded in $(( ($(date +%s%3N) - attempt_start) / 1000 ))s"
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "::warning::rsync attempt $i failed after $(( ($(date +%s%3N) - attempt_start) / 1000 ))s (likely a locked file); retrying..."
              sleep 2
            done
            copy_ms=$(( $(date +%s%3N) - copy_start ))

            if [ "$ok" -ne 1 ]; then
              echo "::error::Copying changed files failed after $attempts attempts and $(( copy_ms / 1000 ))s"
              exit 1
            fi
          fi

          # Deletes are one CIFS round-trip each, so a large prune is latency-bound rather than
          # bandwidth-bound and is worth timing separately from the copy.
          #
          # Both properties below exist because a plain `rm -f` loop over a mounted share gave zero
          # visibility and no way out: with no per-file output, a delete that is merely slow (this link's
          # per-op latency is highly variable — see the rsync --out-format gaps above) is indistinguishable
          # in the log from one that has hung on a stale CIFS handle, and `rm -f` has no timeout of its
          # own, so a single wedged delete blocks the job until GitHub's own multi-hour cap. `timeout 30`
          # turns that into a bounded, loud failure naming the exact file; the per-file echo (mirroring
          # rsync's own --out-format above) means "stuck" vs "slow" is answered by the log, not a guess.
          delete_ms=0
          if [ -s removed.list ]; then
            delete_start=$(date +%s%3N)
            while IFS= read -r path; do
              echo "$(date '+%Y/%m/%d %H:%M:%S')  deleting  $path"
              if ! timeout 30 rm -f "$MOUNT_POINT/$path"; then
                echo "::error::Deleting '$path' did not complete within 30s — likely a stale/held CIFS handle."
                exit 1
              fi
            done < removed.list
            delete_ms=$(( $(date +%s%3N) - delete_start ))
            echo "Deleted $removed_count file(s) in $(( delete_ms / 1000 ))s"
          fi

          # Both rates matter, and which one is poor says where the bottleneck is: low MB/s with
          # healthy files/s means the link is the limit; low files/s with healthy MB/s means CIFS
          # round-trip latency is, and the fix is fewer files rather than smaller ones.
          summary=$(awk -v n="$changed_count" -v b="$changed_bytes" -v cms="$copy_ms" \
                        -v dn="$removed_count" -v dms="$delete_ms" '
            BEGIN {
              mb = b / 1048576
              cs = cms / 1000
              ds = dms / 1000
              printf "| Metric | Value |\n|---|---|\n"
              printf "| Files copied | %d |\n", n
              printf "| Bytes copied | %.1f MB |\n", mb
              printf "| Copy time | %.1fs |\n", cs
              if (cs > 0) {
                printf "| Throughput | %.2f MB/s |\n", mb / cs
                printf "| File rate | %.1f files/s |\n", n / cs
              }
              printf "| Files deleted | %d |\n", dn
              printf "| Delete time | %.1fs |\n", ds
              if (ds > 0) printf "| Delete rate | %.1f files/s |\n", dn / ds
              printf "| Total | %.1fs |\n", cs + ds
            }')

          echo "$summary"
          {
            echo "### Applying changed files"
            echo ""
            echo "$summary"
            if [ "$attempts" -gt 1 ]; then
              echo ""
              echo "⚠️ rsync needed **$attempts attempts** — retries re-send every file, so each one costs a full copy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wake site (remove app_offline.htm)
        if: steps.diff.outputs.has_changes == 'true'
        run: rm -f "$MOUNT_POINT/app_offline.htm"

      - name: Warm up and verify
        run: curl --fail --show-error --retry 5 --retry-delay 3 https://ahk.aut.bme.hu/

      # Last content-mutating step, and only reached after the copy/delete above succeeded. A run that
      # fails partway leaves the OLD manifest in place, so the next run still sees those files as
      # "changed" and retries them — a failed run can only ever under-count what's already been done,
      # never understate future work.
      - name: Publish new deployment manifest
        if: steps.diff.outputs.has_changes == 'true'
        run: cp new.manifest "$MOUNT_POINT/$MANIFEST_NAME"

      # ---- F. Teardown (always) ----

      - name: Unmount share
        if: always()
        run: sudo umount "$MOUNT_POINT" || true

      - name: Disconnect VPN
        if: always()
        run: sudo pkill -f sstpc || true
